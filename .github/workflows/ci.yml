name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests use the offline hashing embedder and never call an AI service.
      SEARCH_EMBEDDER: hash
      AI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy .
      - name: Tests
        run: pytest
      - name: Sample site is in sync with its source
        run: |
          python scripts/build_sample_site.py
          git diff --exit-code sample_site/public
